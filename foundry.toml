[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"
evm_version = "cancun"
ffi = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }

[profile.default.fuzz]
runs = 1000

# Heavy fuzzing profile: run with `FOUNDRY_PROFILE=fuzz forge test`
[profile.fuzz.fuzz]
runs = 1000000
max_test_rejects = 100000000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
